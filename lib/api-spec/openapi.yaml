openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Gold Shop Management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard stats
  - name: customers
    description: Customer management
  - name: products
    description: Product management
  - name: invoices
    description: Invoice management
  - name: prices
    description: Gold/silver price management
  - name: settings
    description: Company settings

paths:
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get company settings
      responses:
        "200":
          description: Company settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanySettings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update company settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanySettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanySettings"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/category-summary:
    get:
      operationId: getCategorySummary
      tags: [dashboard]
      summary: Get category-wise sales summary for a date range
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
        - name: endDate
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Category-wise sales summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategorySummary"

  /prices:
    get:
      operationId: getPrices
      tags: [prices]
      summary: Get current gold and silver prices
      responses:
        "200":
          description: Current prices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prices"
    put:
      operationId: updatePrices
      tags: [prices]
      summary: Update gold and silver prices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricesInput"
      responses:
        "200":
          description: Updated prices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prices"

  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List all customers
      parameters:
        - name: search
          in: query
          description: "Global search term matched (case-insensitive, OR logic) against name, mobile, passportNumber, and emiratesId."
          schema:
            type: string
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerListItem"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a new customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Created customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get a customer by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateCustomer
      tags: [customers]
      summary: Update a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
    delete:
      operationId: deleteCustomer
      tags: [customers]
      summary: Delete a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products
      parameters:
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a new product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{id}:
    put:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      summary: List all invoices
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: paymentMethod
          in: query
          schema:
            type: string
        - name: startDate
          in: query
          schema:
            type: string
        - name: endDate
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
    post:
      operationId: createInvoice
      tags: [invoices]
      summary: Create a new invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceInput"
      responses:
        "201":
          description: Created invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [invoices]
      summary: Get an invoice by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteInvoice
      tags: [invoices]
      summary: Delete an invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /invoices/monthly-sales:
    get:
      operationId: getMonthlySales
      tags: [invoices]
      summary: Get monthly sales data for chart
      responses:
        "200":
          description: Monthly sales breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlySale"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    DashboardStats:
      type: object
      required:
        - todayTotalSale
        - monthlySale
        - cashCollection
        - cardCollection
        - bankTransferCollection
        - totalCustomers
        - totalProducts
        - totalInvoices
        - pendingPaymentsCount
        - recentInvoices
        - goldPricePerGram
        - silverPricePerGram
        - todayGoldJewelryCount
        - todayGoldJewelryAmount
        - todayKgBarCount
        - todayKgBarAmount
        - todayTtBarCount
        - todayTtBarAmount
        - monthlyGoldJewelryCount
        - monthlyGoldJewelryAmount
        - monthlyKgBarCount
        - monthlyKgBarAmount
        - monthlyTtBarCount
        - monthlyTtBarAmount
        - todaySilverCount
        - todaySilverAmount
        - monthlySilverCount
        - monthlySilverAmount
        - todayGoldCount
        - todayGoldAmount
        - monthlyGoldCount
        - monthlyGoldAmount
      properties:
        todayTotalSale:
          type: number
        monthlySale:
          type: number
        cashCollection:
          type: number
        cardCollection:
          type: number
        bankTransferCollection:
          type: number
        totalCustomers:
          type: integer
        totalProducts:
          type: integer
        totalInvoices:
          type: integer
        pendingPaymentsCount:
          type: integer
        goldPricePerGram:
          type: number
        silverPricePerGram:
          type: number
        todayGoldJewelryCount:
          type: integer
        todayGoldJewelryAmount:
          type: number
        todayKgBarCount:
          type: integer
        todayKgBarAmount:
          type: number
        todayTtBarCount:
          type: integer
        todayTtBarAmount:
          type: number
        monthlyGoldJewelryCount:
          type: integer
        monthlyGoldJewelryAmount:
          type: number
        monthlyKgBarCount:
          type: integer
        monthlyKgBarAmount:
          type: number
        monthlyTtBarCount:
          type: integer
        monthlyTtBarAmount:
          type: number
        todaySilverCount:
          type: integer
        todaySilverAmount:
          type: number
        monthlySilverCount:
          type: integer
        monthlySilverAmount:
          type: number
        todayGoldJewelryGrams:
          type: number
        todayTotalGoldGrams:
          type: number
        todayKgBarGrams:
          type: number
        todayTtBarGrams:
          type: number
        todaySilverGrams:
          type: number
        monthlyGoldJewelryGrams:
          type: number
        monthlyTotalGoldGrams:
          type: number
        monthlyKgBarGrams:
          type: number
        monthlyTtBarGrams:
          type: number
        monthlySilverGrams:
          type: number
        todayGoldCount:
          type: integer
        todayGoldAmount:
          type: number
        todayGoldGrams:
          type: number
        monthlyGoldCount:
          type: integer
        monthlyGoldAmount:
          type: number
        monthlyGoldGrams:
          type: number
        recentInvoices:
          type: array
          items:
            $ref: "#/components/schemas/Invoice"

    CategorySummaryRow:
      type: object
      required: [category, label, grossGrams, grams, amount, invoiceCount]
      properties:
        category:
          type: string
        label:
          type: string
        grossGrams:
          type: number
        grams:
          type: number
        amount:
          type: number
        invoiceCount:
          type: integer

    CategorySummary:
      type: object
      required: [startDate, endDate, rows, grandTotalGrossGrams, grandTotalGrams, grandTotalAmount]
      properties:
        startDate:
          type: string
        endDate:
          type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/CategorySummaryRow"
        grandTotalGrossGrams:
          type: number
        grandTotalGrams:
          type: number
        grandTotalAmount:
          type: number

    Prices:
      type: object
      required: [id, goldPricePerGram, silverPricePerGram, goldJewelryRate, goldBullionRate, ttBarRate, kgBarRate, customDescriptions, updatedAt]
      properties:
        id:
          type: integer
        goldPricePerGram:
          type: number
        silverPricePerGram:
          type: number
        goldJewelryRate:
          type: number
        goldBullionRate:
          type: number
        ttBarRate:
          type: number
        kgBarRate:
          type: number
        customDescriptions:
          type: array
          items:
            $ref: "#/components/schemas/CustomDescription"
        updatedAt:
          type: string

    CustomDescription:
      type: object
      required: [name, rate]
      properties:
        name:
          type: string
        rate:
          type: number

    PricesInput:
      type: object
      properties:
        goldPricePerGram:
          type: number
        silverPricePerGram:
          type: number
        goldJewelryRate:
          type: number
        goldBullionRate:
          type: number
        ttBarRate:
          type: number
        kgBarRate:
          type: number
        customDescriptions:
          type: array
          items:
            $ref: "#/components/schemas/CustomDescription"

    Customer:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        mobile:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        passportNumber:
          type: ["string", "null"]
        emiratesId:
          type: ["string", "null"]
        nationality:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        createdAt:
          type: string

    CustomerListItem:
      type: object
      required: [id, name, createdAt, invoiceCount, totalSpent]
      properties:
        id:
          type: integer
        name:
          type: string
        mobile:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        passportNumber:
          type: ["string", "null"]
        emiratesId:
          type: ["string", "null"]
        nationality:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        createdAt:
          type: string
        invoiceCount:
          type: integer
        totalSpent:
          type: number

    CustomerInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        mobile:
          type: string
        email:
          type: string
        passportNumber:
          type: string
        emiratesId:
          type: string
        nationality:
          type: string
        address:
          type: string
        country:
          type: string

    Product:
      type: object
      required: [id, name, category, unit, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        unit:
          type: string
        pricePerUnit:
          type: ["number", "null"]
        stock:
          type: ["number", "null"]
        createdAt:
          type: string

    ProductInput:
      type: object
      required: [name, category, unit]
      properties:
        name:
          type: string
        category:
          type: string
        unit:
          type: string
        pricePerUnit:
          type: number
        stock:
          type: number

    InvoiceItem:
      type: object
      required: [id, invoiceId, description, quantity, unitPrice, totalPrice]
      properties:
        id:
          type: integer
        invoiceId:
          type: integer
        productId:
          type: ["integer", "null"]
        description:
          type: string
        category:
          type: ["string", "null"]
        quantity:
          type: number
        weight:
          type: ["number", "null"]
        grossWeight:
          type: ["number", "null"]
        purity:
          type: ["string", "null"]
        pureWeight:
          type: ["number", "null"]
        makingRate:
          type: ["number", "null"]
        makingAmt:
          type: ["number", "null"]
        unitPrice:
          type: number
        totalPrice:
          type: number

    InvoiceItemInput:
      type: object
      required: [description, quantity, unitPrice, totalPrice]
      properties:
        productId:
          type: integer
        description:
          type: string
        category:
          type: string
        quantity:
          type: number
        weight:
          type: number
        grossWeight:
          type: number
        purity:
          type: string
        pureWeight:
          type: number
        makingRate:
          type: number
        makingAmt:
          type: number
        unitPrice:
          type: number
        totalPrice:
          type: number

    Invoice:
      type: object
      required: [id, invoiceNumber, paymentMethod, subtotal, total, createdAt]
      properties:
        id:
          type: integer
        invoiceNumber:
          type: string
        customerId:
          type: ["integer", "null"]
        customerName:
          type: ["string", "null"]
        customerMobile:
          type: ["string", "null"]
        customerEmail:
          type: ["string", "null"]
        customerPassportNumber:
          type: ["string", "null"]
        customerEmiratesId:
          type: ["string", "null"]
        customerNationality:
          type: ["string", "null"]
        customerCountry:
          type: ["string", "null"]
        customerAddress:
          type: ["string", "null"]
        paymentMethod:
          type: string
          enum: [cash, card, bank_transfer]
        metalRate:
          type: ["number", "null"]
        placeOfSupply:
          type: ["string", "null"]
        subtotal:
          type: number
        discount:
          type: number
        total:
          type: number
        vatRate:
          type: ["number", "null"]
        vatAmount:
          type: ["number", "null"]
        totalBeforeVat:
          type: ["number", "null"]
        totalIncludingVat:
          type: ["number", "null"]
        roundOffDiscount:
          type: ["number", "null"]
        notes:
          type: ["string", "null"]
        isPending:
          type: boolean
        createdAt:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceItem"

    InvoiceInput:
      type: object
      required: [paymentMethod, subtotal, total, items]
      properties:
        customerId:
          type: integer
        customerName:
          type: string
        customerMobile:
          type: string
        customerEmail:
          type: string
        customerPassportNumber:
          type: string
        customerEmiratesId:
          type: string
        customerNationality:
          type: string
        customerCountry:
          type: string
        customerAddress:
          type: string
        paymentMethod:
          type: string
          enum: [cash, card, bank_transfer]
        metalRate:
          type: number
        placeOfSupply:
          type: string
        subtotal:
          type: number
        discount:
          type: number
        total:
          type: number
        vatRate:
          type: number
        vatAmount:
          type: number
        totalBeforeVat:
          type: number
        totalIncludingVat:
          type: number
        roundOffDiscount:
          type: number
        notes:
          type: string
        isPending:
          type: boolean
        createdAt:
          type: string
          description: "Optional invoice date (ISO datetime string). When provided, overrides the default current timestamp so back-dated invoices can be created."
        items:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceItemInput"

    CompanySettings:
      type: object
      required: [id, companyName, address, phone, email, trn, logoType, logoInitial]
      properties:
        id:
          type: integer
        companyName:
          type: string
        tagline:
          type: ["string", "null"]
        address:
          type: string
        phone:
          type: string
        email:
          type: string
        trn:
          type: string
        locationUrl:
          type: ["string", "null"]
        logoType:
          type: string
        logoInitial:
          type: string
        logoImageUrl:
          type: ["string", "null"]
        stampSignatureUrl:
          type: ["string", "null"]

    CompanySettingsInput:
      type: object
      properties:
        companyName:
          type: string
        tagline:
          type: string
        address:
          type: string
        phone:
          type: string
        email:
          type: string
        trn:
          type: string
        locationUrl:
          type: string
        logoType:
          type: string
        logoInitial:
          type: string
        logoImageUrl:
          type: string
        stampSignatureUrl:
          type: string

    MonthlySale:
      type: object
      required: [month, total, cash, card, bankTransfer]
      properties:
        month:
          type: string
        total:
          type: number
        cash:
          type: number
        card:
          type: number
        bankTransfer:
          type: number
