      required: [showroomLogoUrl]
      properties:
        showroomLogoUrl:
          type: ["string", "null"]

    SpotPrice:
      type: object
      required: [usdPerOz, aedPerGram, updatedAt]
      properties:
        usdPerOz:
          type: number
          description: Live international Gold Spot (XAU/USD) price in USD per troy ounce.
        aedPerGram:
          type: number
          description: "Base_24K_AED in AED per gram: (usdPerOz / 31.1034768) * 3.6725. Verified to match livepriceofgold.com Dubai AED/gram display to ±1¢."
        baseAedPerGram:
          type: ["number", "null"]
          description: Same as aedPerGram — (usdPerOz / 31.1034768) * 3.6725.
        bidUsdPerOz:
          type: ["number", "null"]
          description: Synthesized live Bid price (USD per troy ounce) — usdPerOz minus half the market spread.
        askUsdPerOz:
          type: ["number", "null"]
          description: Synthesized live Ask price (USD per troy ounce) — usdPerOz plus half the market spread.
        dailyLowUsdPerOz:
          type: ["number", "null"]
          description: Lowest usdPerOz tick observed since UTC midnight today.
        dailyHighUsdPerOz:
          type: ["number", "null"]
          description: Highest usdPerOz tick observed since UTC midnight today.
        spreadPercent:
          type: ["number", "null"]
          description: Currently active admin spread margin (%). aedPerGram already has this baked in; expose for UI display.
        laborCostPercent:
          type: ["number", "null"]
          description: Currently active admin labor markup (%) for jewelry rows.
        updatedAt:
          type: string
          description: ISO-8601 timestamp of when this price was fetched.

    PriceItem:
      type: object
      required: [id, name, displayOrder, formulaType, weightLabel, purityFactor, premiumOffsetAed, tvVisible, isCore, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        displayOrder:
          type: integer
        formulaType:
          type: string
          enum: [spot_per_gram, spot_bar, manual]
          description: "spot_per_gram: baseSpot×purity+offset (per-gram items). spot_bar: baseSpot×weightGrams×purity+offset (fixed-weight bars). manual: fixed manualRateAed."
        weightGrams:
          type: ["number", "null"]
          description: Weight in grams for spot_bar items (e.g. 116.638 for TT Bar). Null otherwise.
        weightLabel:
          type: string
          description: Display label for the WEIGHT column (e.g. TTB, 1KG, 1GM).
        purityFactor:
          type: number
          description: Multiplier applied to the raw spot base (e.g. 0.9999, 0.9200, 0.9950).
        premiumOffsetAed:
          type: number
          description: Fixed AED amount added after the spot formula (positive = premium, negative = discount).
        manualRateAed:
          type: ["number", "null"]
          description: Fixed AED rate used when formulaType = manual.
        tvVisible:
          type: boolean
          description: Whether this item is shown on the showroom TV board.
        isCore:
          type: boolean
          description: Core system items cannot be deleted.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PriceItemInput:
      type: object
      required: [name, formulaType, weightLabel, purityFactor]
      properties:
        name:
          type: string
        displayOrder:
          type: integer
        formulaType:
          type: string
          enum: [spot_per_gram, spot_bar, manual]
        weightGrams:
          type: ["number", "null"]
        weightLabel:
          type: string
        purityFactor:
          type: number
        premiumOffsetAed:
          type: number
        manualRateAed:
          type: ["number", "null"]
        tvVisible:
          type: boolean

