openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Gold Shop Management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard stats
  - name: customers
    description: Customer management
  - name: products
    description: Product management
  - name: invoices
    description: Invoice management
  - name: prices
    description: Gold/silver price management
  - name: settings
    description: Company settings

paths:
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get company settings
      responses:
        "200":
          description: Company settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanySettings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update company settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanySettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanySettings"

  /settings/public:
    get:
      operationId: getPublicSettings
      tags: [settings]
      summary: Get public showroom display settings (unauthenticated)
      responses:
        "200":
          description: Public showroom settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSettings"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/category-summary:
    get:
      operationId: getCategorySummary
      tags: [dashboard]
      summary: Get category-wise sales summary for a date range
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
        - name: endDate
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Category-wise sales summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategorySummary"

  /prices:
    get:
      operationId: getPrices
      tags: [prices]
      summary: Get current gold and silver prices
      responses:
        "200":
          description: Current prices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prices"
    put:
      operationId: updatePrices
      tags: [prices]
      summary: Update gold and silver prices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricesInput"
      responses:
        "200":
          description: Updated prices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prices"

  /prices/spot:
    get:
      operationId: getPricesSpot
      tags: [prices]
      summary: Current live gold spot price (USD/oz + AED/g). Fetched from Yahoo Finance and cached for 10 seconds. Public, no authentication required.
      responses:
        "200":
          description: Current spot price
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotPrice"
        "503":
          description: Spot price temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /prices/public:
    get:
      operationId: getPublicPrices
      tags: [prices]
      summary: Get the minimal set of rates needed for the public showroom price display board (no authentication required, no sensitive fields).
      responses:
        "200":
          description: Current public display rates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPrices"

  /prices/items/public:
    get:
      operationId: getPublicPriceItems
      tags: [prices]
      summary: Get all TV-board price items with their formula parameters (public, no authentication required).
      responses:
        "200":
          description: List of price items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PriceItem"

  /prices/items:
    get:
      operationId: listPriceItems
      tags: [prices]
      summary: List all price items (admin)
      responses:
        "200":
          description: List of all price items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PriceItem"
    post:
      operationId: createPriceItem
      tags: [prices]
      summary: Create a new price item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceItemInput"
      responses:
        "201":
          description: Created price item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceItem"

  /prices/items/{id}:
    put:
      operationId: updatePriceItem
      tags: [prices]
      summary: Update a price item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceItemInput"
      responses:
        "200":
          description: Updated price item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deletePriceItem
      tags: [prices]
      summary: Delete a non-core price item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "400":
          description: Cannot delete a core item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List all customers
      parameters:
        - name: search
          in: query
          description: "Global search term matched (case-insensitive, OR logic) against name, mobile, passportNumber, and emiratesId."
          schema:
            type: string
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerListItem"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a new customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Created customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get a customer by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateCustomer
      tags: [customers]
      summary: Update a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
    delete:
      operationId: deleteCustomer
      tags: [customers]
      summary: Delete a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products
      parameters:
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a new product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{id}:
    put:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      summary: List all invoices
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: paymentMethod
          in: query
          schema:
            type: string
        - name: startDate
          in: query
          schema:
            type: string
        - name: endDate
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
    post:
      operationId: createInvoice
      tags: [invoices]
      summary: Create a new invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceInput"
      responses:
        "201":
          description: Created invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [invoices]
      summary: Get an invoice by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteInvoice
      tags: [invoices]
      summary: Delete an invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /invoices/monthly-sales:
    get:
      operationId: getMonthlySales
      tags: [invoices]
      summary: Get monthly sales data for chart
      responses:
        "200":
          description: Monthly sales breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlySale"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    DashboardStats:
      type: object
      required:
        - todayTotalSale
        - monthlySale
        - cashCollection
        - cardCollection
        - bankTransferCollection
        - totalCustomers
        - totalProducts
        - totalInvoices
        - pendingPaymentsCount
        - recentInvoices
        - goldPricePerGram
        - silverPricePerGram
        - todayGoldJewelryCount
        - todayGoldJewelryAmount
        - todayKgBarCount
        - todayKgBarAmount
        - todayTtBarCount
        - todayTtBarAmount
        - monthlyGoldJewelryCount
        - monthlyGoldJewelryAmount
        - monthlyKgBarCount
        - monthlyKgBarAmount
        - monthlyTtBarCount
        - monthlyTtBarAmount
        - todaySilverCount
        - todaySilverAmount
        - monthlySilverCount
        - monthlySilverAmount
        - todayGoldCount
        - todayGoldAmount
        - monthlyGoldCount
        - monthlyGoldAmount
      properties:
        todayTotalSale:
          type: number
        monthlySale:
          type: number
        cashCollection:
          type: number
        cardCollection:
          type: number
        bankTransferCollection:
          type: number
        totalCustomers:
          type: integer
        totalProducts:
          type: integer
        totalInvoices:
          type: integer
        pendingPaymentsCount:
          type: integer
        goldPricePerGram:
          type: number
        silverPricePerGram:
          type: number
        todayGoldJewelryCount:
          type: integer
        todayGoldJewelryAmount:
          type: number
        todayKgBarCount:
          type: integer
        todayKgBarAmount:
          type: number
        todayTtBarCount:
          type: integer
        todayTtBarAmount:
          type: number
        monthlyGoldJewelryCount:
          type: integer
        monthlyGoldJewelryAmount:
          type: number
        monthlyKgBarCount:
          type: integer
        monthlyKgBarAmount:
          type: number
        monthlyTtBarCount:
          type: integer
        monthlyTtBarAmount:
          type: number
        todaySilverCount:
          type: integer
        todaySilverAmount:
          type: number
        monthlySilverCount:
          type: integer
        monthlySilverAmount:
          type: number
        todayGoldJewelryGrams:
          type: number
        todayTotalGoldGrams:
          type: number
        todayKgBarGrams:
          type: number
        todayTtBarGrams:
          type: number
        todaySilverGrams:
          type: number
        monthlyGoldJewelryGrams:
          type: number
        monthlyTotalGoldGrams:
          type: number
        monthlyKgBarGrams:
          type: number
        monthlyTtBarGrams:
          type: number
        monthlySilverGrams:
          type: number
        todayGoldCount:
          type: integer
        todayGoldAmount:
          type: number
        todayGoldGrams:
          type: number
        monthlyGoldCount:
          type: integer
        monthlyGoldAmount:
          type: number
        monthlyGoldGrams:
          type: number
        recentInvoices:
          type: array
          items:
            $ref: "#/components/schemas/Invoice"

    CategorySummaryRow:
      type: object
      required: [category, label, grossGrams, grams, amount, invoiceCount]
      properties:
        category:
          type: string
        label:
          type: string
        grossGrams:
          type: number
        grams:
          type: number
        amount:
          type: number
        invoiceCount:
          type: integer

    PaymentMethodBreakdown:
      type: object
      required: [totalCash, totalCard, totalCredit, grandTotal]
      properties:
        totalCash:
          type: number
        totalCard:
          type: number
        totalCredit:
          type: number
        grandTotal:
          type: number

    CategorySummary:
      type: object
      required: [startDate, endDate, rows, grandTotalGrossGrams, grandTotalGrams, grandTotalAmount, paymentBreakdown]
      properties:
        startDate:
          type: string
        endDate:
          type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/CategorySummaryRow"
        grandTotalGrossGrams:
          type: number
        grandTotalGrams:
          type: number
        grandTotalAmount:
          type: number
        paymentBreakdown:
          $ref: "#/components/schemas/PaymentMethodBreakdown"

    Prices:
      type: object
      required: [id, goldPricePerGram, silverPricePerGram, goldJewelryRate, goldBullionRate, ttBarRate, ttBar24kRate, kgBarRate, gold22kRate, gold21kRate, gold18kRate, gold9999Rate, goldKg9999Rate, spreadPremiumPercent, laborCostPercent, customDescriptions, updatedAt, liveModeConnected, manualInvoiceMode, tvShowTtBar995, tvShowTtBar999, tvShowGold9999, tvShowKgBar995, tvShowGold22k, tvShowGold21k, tvShowGold18k, tvShowGoldKg9999]
      properties:
        id:
          type: integer
        goldPricePerGram:
          type: number
        silverPricePerGram:
          type: number
        goldJewelryRate:
          type: number
        goldBullionRate:
          type: number
        ttBarRate:
          type: number
        ttBar24kRate:
          type: number
        kgBarRate:
          type: number
        gold22kRate:
          type: number
        gold21kRate:
          type: number
        gold18kRate:
          type: number
        gold9999Rate:
          type: number
        goldKg9999Rate:
          type: number
          description: GOLD KG (0.9999) per-gram rate for admin and invoices; TV board shows 1KG total.
        spreadPremiumPercent:
          type: number
          description: Admin-configurable spread margin (%). Adjusted_Base = Base_24K_AED × (1 + spreadPremiumPercent / 100).
        laborCostPercent:
          type: number
          description: Admin-configurable labor markup (%) applied to jewelry rows (22K/21K/18K) on top of the spread-adjusted base.
        customDescriptions:
          type: array
          items:
            $ref: "#/components/schemas/CustomDescription"
        updatedAt:
          type: string
        liveModeConnected:
          type: boolean
        manualInvoiceMode:
          type: boolean
          description: When true, invoice creation uses admin-set manual rates instead of the live spot feed.
        liveGoldRate24k:
          type: ["number", "null"]
        liveGoldRate22k:
          type: ["number", "null"]
        liveSilverRate:
          type: ["number", "null"]
        liveGoldBid:
          type: ["number", "null"]
          description: Last persisted Bid snapshot (USD/oz). Live values stream via /prices/spot, not this field.
        liveGoldAsk:
          type: ["number", "null"]
          description: Last persisted Ask snapshot (USD/oz). Live values stream via /prices/spot, not this field.
        liveGoldHigh:
          type: ["number", "null"]
          description: Last persisted daily High snapshot (USD/oz). Live values stream via /prices/spot, not this field.
        liveGoldLow:
          type: ["number", "null"]
          description: Last persisted daily Low snapshot (USD/oz). Live values stream via /prices/spot, not this field.
        liveLastSyncedAt:
          type: ["string", "null"]
        tvShowTtBar995:
          type: boolean
          description: Whether the TT. BAR (0.995) row is visible on the showroom TV board.
        tvShowTtBar999:
          type: boolean
          description: Whether the TT. BAR (0.999) row is visible on the showroom TV board.
        tvShowGold9999:
          type: boolean
          description: Whether the GOLD (0.9999) row is visible on the showroom TV board.
        tvShowKgBar995:
          type: boolean
          description: Whether the KG BAR (0.995) row is visible on the showroom TV board.
        tvShowGold22k:
          type: boolean
          description: Whether the Gold Jewelry 22K row is visible on the showroom TV board.
        tvShowGold21k:
          type: boolean
          description: Whether the Gold Jewelry 21K row is visible on the showroom TV board.
        tvShowGold18k:
          type: boolean
          description: Whether the Gold Jewelry 18K row is visible on the showroom TV board.
        tvShowGoldKg9999:
          type: boolean
          description: Whether the GOLD KG (0.9999) row is visible on the showroom TV board.

    PublicPrices:
      type: object
      description: Minimal, non-sensitive rate snapshot exposed publicly for the showroom price display board.
      required: [goldBullionRate, ttBarRate, ttBar24kRate, kgBarRate, silverPricePerGram, gold22kRate, gold21kRate, gold18kRate, gold9999Rate, goldKg9999Rate, liveModeConnected, updatedAt, tvShowTtBar995, tvShowTtBar999, tvShowGold9999, tvShowKgBar995, tvShowGold22k, tvShowGold21k, tvShowGold18k, tvShowGoldKg9999]
      properties:
        goldBullionRate:
          type: number
        ttBarRate:
          type: number
        ttBar24kRate:
          type: number
        kgBarRate:
          type: number
        silverPricePerGram:
          type: number
        gold22kRate:
          type: number
        gold21kRate:
          type: number
        gold18kRate:
          type: number
        gold9999Rate:
          type: number
        goldKg9999Rate:
          type: number
        liveModeConnected:
          type: boolean
        liveSilverRate:
          type: ["number", "null"]
        liveGoldBid:
          type: ["number", "null"]
        liveGoldAsk:
          type: ["number", "null"]
        liveGoldHigh:
          type: ["number", "null"]
        liveGoldLow:
          type: ["number", "null"]
        updatedAt:
          type: string
        tvShowTtBar995:
          type: boolean
        tvShowTtBar999:
          type: boolean
        tvShowGold9999:
          type: boolean
        tvShowKgBar995:
          type: boolean
        tvShowGold22k:
          type: boolean
        tvShowGold21k:
          type: boolean
        tvShowGold18k:
          type: boolean
        tvShowGoldKg9999:
          type: boolean


    CustomDescription:
      type: object
      required: [name, rate]
      properties:
        name:
          type: string
        rate:
          type: number

    PricesInput:
      type: object
      properties:
        goldPricePerGram:
          type: number
        silverPricePerGram:
          type: number
        goldJewelryRate:
          type: number
        goldBullionRate:
          type: number
        ttBarRate:
          type: number
        ttBar24kRate:
          type: number
        kgBarRate:
          type: number
        gold22kRate:
          type: number
        gold21kRate:
          type: number
        gold18kRate:
          type: number
        gold9999Rate:
          type: number
        goldKg9999Rate:
          type: number
        spreadPremiumPercent:
          type: ["number", "null"]
          description: Spread margin percentage to write. Adjusted_Base = Base_24K_AED × (1 + spreadPremiumPercent / 100).
        laborCostPercent:
          type: ["number", "null"]
          description: Labor markup percentage for jewelry rows (22K/21K/18K).
        customDescriptions:
          type: array
          items:
            $ref: "#/components/schemas/CustomDescription"
        manualInvoiceMode:
          type: boolean
          description: When true, invoice creation uses admin-set manual rates instead of the live spot feed.
        tvShowTtBar995:
          type: boolean
        tvShowTtBar999:
          type: boolean
        tvShowGold9999:
          type: boolean
        tvShowKgBar995:
          type: boolean
        tvShowGold22k:
          type: boolean
        tvShowGold21k:
          type: boolean
        tvShowGold18k:
          type: boolean
        tvShowGoldKg9999:
          type: boolean

    Customer:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        mobile:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        passportNumber:
          type: ["string", "null"]
        emiratesId:
          type: ["string", "null"]
        nationality:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        createdAt:
          type: string

    CustomerListItem:
      type: object
      required: [id, name, createdAt, invoiceCount, totalSpent]
      properties:
        id:
          type: integer
        name:
          type: string
        mobile:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        passportNumber:
          type: ["string", "null"]
        emiratesId:
          type: ["string", "null"]
        nationality:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        createdAt:
          type: string
        invoiceCount:
          type: integer
        totalSpent:
          type: number

    CustomerInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        mobile:
          type: string
        email:
          type: string
        passportNumber:
          type: string
        emiratesId:
          type: string
        nationality:
          type: string
        address:
          type: string
        country:
          type: string

    Product:
      type: object
      required: [id, name, category, unit, createdAt]
      properties:
