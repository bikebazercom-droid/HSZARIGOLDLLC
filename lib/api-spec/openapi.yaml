openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Gold Shop Management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard stats
  - name: customers
    description: Customer management
  - name: products
    description: Product management
  - name: invoices
    description: Invoice management
  - name: prices
    description: Gold/silver price management
  - name: settings
    description: Company settings

paths:
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get company settings
      responses:
        "200":
          description: Company settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanySettings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update company settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanySettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanySettings"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/category-summary:
    get:
      operationId: getCategorySummary
      tags: [dashboard]
      summary: Get category-wise sales summary for a date range
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
        - name: endDate
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Category-wise sales summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategorySummary"

  /prices:
    get:
      operationId: getPrices
      tags: [prices]
      summary: Get current gold and silver prices
      responses:
        "200":
          description: Current prices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prices"
    put:
      operationId: updatePrices
      tags: [prices]
      summary: Update gold and silver prices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricesInput"
      responses:
        "200":
          description: Updated prices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prices"

  /prices/items/public:
    get:
      operationId: getPublicPriceItems
      tags: [prices]
      summary: Get all TV-board price items with their formula parameters (public, no authentication required).
      responses:
        "200":
          description: List of price items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PriceItem"

  /prices/items:
    get:
      operationId: listPriceItems
      tags: [prices]
      summary: List all price items (admin)
      responses:
        "200":
          description: List of all price items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PriceItem"
    post:
      operationId: createPriceItem
      tags: [prices]
      summary: Create a new price item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceItemInput"
      responses:
        "201":
          description: Created price item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceItem"

  /prices/items/{id}:
    put:
      operationId: updatePriceItem
      tags: [prices]
      summary: Update a price item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceItemInput"
      responses:
        "200":
          description: Updated price item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deletePriceItem
      tags: [prices]
      summary: Delete a non-core price item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "400":
          description: Cannot delete a core item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List all customers
      parameters:
        - name: search
          in: query
          description: "Global search term matched (case-insensitive, OR logic) against name, mobile, passportNumber, and emiratesId."
          schema:
            type: string
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerListItem"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a new customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Created customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get a customer by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateCustomer
      tags: [customers]
      summary: Update a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
    delete:
      operationId: deleteCustomer
      tags: [customers]
      summary: Delete a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products
      parameters:
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a new product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{id}:
    put:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      summary: List all invoices
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: paymentMethod
          in: query
          schema:
            type: string
        - name: startDate
          in: query
          schema:
            type: string
        - name: endDate
          in: query
          schema:
            type: string
        - name: category
          in: query
          description: Stock category bucket ("995" is its own bucket; gold_jewelry_22k covers all jewelry karats)
          schema:
            type: string
            enum: [gold, tt_bar, kg_bar, "995", gold_jewelry_22k, silver]
      responses:
        "200":
          description: List of invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
    post:
      operationId: createInvoice
      tags: [invoices]
      summary: Create a new invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceInput"
      responses:
        "201":
          description: Created invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [invoices]
      summary: Get an invoice by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteInvoice
      tags: [invoices]
      summary: Delete an invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /invoices/{id}/profit:
    get:
      operationId: getInvoiceProfit
      tags: [invoices]
      summary: Per-item exact FIFO COGS, profit, and consumed purchase lots for an invoice (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Batch-level profit breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceProfit"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stock/levels:
    get:
      operationId: listStockLevels
      tags: [stock]
      summary: Live aggregated stock weight per category
      responses:
        "200":
          description: Stock levels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockLevel"

  /stock/purchases:
    get:
      operationId: listStockPurchases
      tags: [stock]
      summary: List stock purchases (supplier ledger)
      parameters:
        - name: supplier
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: startDate
          in: query
          schema:
            type: string
        - name: endDate
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Stock purchases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockPurchase"
    post:
      operationId: createStockPurchase
      tags: [stock]
      summary: Record a stock purchase and increase stock level
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockPurchaseInput"
      responses:
        "201":
          description: Created stock purchase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockPurchase"

  /stock/purchases/{id}:
    delete:
      operationId: deleteStockPurchase
      tags: [stock]
      summary: Delete a stock purchase and reverse its stock effect
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /purchase-bills:
    get:
      operationId: listPurchaseBills
      tags: [stock]
      summary: List purchase bills (supplier inflow documents)
      parameters:
        - name: supplier
          in: query
          schema:
            type: string
        - name: startDate
          in: query
          schema:
            type: string
        - name: endDate
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Purchase bills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PurchaseBill"
    post:
      operationId: createPurchaseBill
      tags: [stock]
      summary: Record a purchase bill; each line item creates a stock batch and posts to the ledgers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseBillInput"
      responses:
        "201":
          description: Created purchase bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseBill"

  /purchase-bills/supplier-liability:
    get:
      operationId: getSupplierLiability
      tags: [stock]
      summary: Per-supplier summary of outstanding (unpaid + unfixed) purchase bill liabilities
      responses:
        "200":
          description: Supplier liability rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierLiabilityReport"

  /purchase-bills/{id}:
    get:
      operationId: getPurchaseBill
      tags: [stock]
      summary: Get a purchase bill with its line items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Purchase bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseBill"
    delete:
      operationId: deletePurchaseBill
      tags: [stock]
      summary: Delete a purchase bill and reverse its stock batches
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /purchase-bills/{id}/payment-status:
    patch:
      operationId: updatePurchaseBillPaymentStatus
      tags: [stock]
      summary: Update the payment status of a purchase bill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillPaymentStatusUpdate"
      responses:
        "200":
          description: Updated purchase bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseBill"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stock/suppliers:
    get:
      operationId: listStockSuppliers
      tags: [stock]
      summary: Distinct supplier names
      responses:
        "200":
          description: Supplier names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /stock/movements:
    get:
      operationId: listStockMovements
      tags: [stock]
      summary: Inventory movement log
      parameters:
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Stock movements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockMovement"

  /dashboard/kpis:
    get:
      operationId: getDashboardKpis
      tags: [dashboard]
      summary: Aggregated KPI metrics for the dashboard 8-card grid, filterable by date range
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
        - name: endDate
          in: query
          schema:
            type: string
      responses:
        "200":
          description: KPI metrics for the requested date range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardKpis"

  /dashboard/summary-cards:
    get:
      operationId: getDashboardSummaryCards
      tags: [dashboard]
      summary: All-time physical stock, category vault movement, and debit/credit financial summary
      responses:
        "200":
          description: Live all-time summary card metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummaryCards"

  /invoices/sales-report:
    get:
      operationId: getSalesReport
      tags: [invoices]
      summary: Item-level sales report with aggregate summary for the invoices page filters and PDF statement
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: startDate
          in: query
          schema:
            type: string
        - name: endDate
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
            enum: [gold, tt_bar, kg_bar, "995", gold_jewelry_22k, silver]
      responses:
        "200":
          description: Sales report rows and summary matching the active filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesReport"

  /invoices/monthly-sales:
    get:
      operationId: getMonthlySales
      tags: [invoices]
      summary: Get monthly sales data for chart
      responses:
        "200":
          description: Monthly sales breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlySale"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    DashboardKpis:
      type: object
      required: [stockInGrams, stockOutGrams, netStockGrams, totalRevenueAed, cashReceivedAed, outstandingDueAed, makingChargesAed, invoiceCount, avgInvoiceAed, purchaseCostAed, cogsAed, netProfitAed]
      properties:
        stockInGrams:
          type: number
          description: Total purchased weight from suppliers in the range
        stockOutGrams:
          type: number
          description: Total sold weight (invoice item gross weight) in the range
        netStockGrams:
          type: number
          description: stockInGrams - stockOutGrams
        totalRevenueAed:
          type: number
        cashReceivedAed:
          type: number
          description: Collected amount (non-pending invoices)
        outstandingDueAed:
          type: number
          description: Pending invoice totals
        makingChargesAed:
          type: number
        invoiceCount:
          type: integer
        avgInvoiceAed:
          type: number
        purchaseCostAed:
          type: number
          description: AED spent purchasing stock from suppliers in the range
        cogsAed:
          type: number
          description: Estimated cost of sold items (weighted-average purchase cost per gram per category x sold grams)
        netProfitAed:
          type: number
          description: totalRevenueAed - cogsAed

    DashboardSummaryCards:
      type: object
      required: [availableStockGrams, availableStockCostAed, silverStockGrams, silverStockCostAed, totalRevenueAed, soldCostAed, netProfitAed, totalPhysicalRemainingGrams, totalPurchaseDebitAed, totalSalesCreditAed, categoryBreakdown]
      properties:
        availableStockGrams:
          type: number
          description: Non-silver purchased grams minus sold grams (live remaining main stock)
        availableStockCostAed:
          type: number
          description: Non-silver purchase cost minus COGS of sold non-silver items (remaining stock at cost)
        silverStockGrams:
          type: number
          description: Silver purchased grams minus silver sold grams
        silverStockCostAed:
          type: number
          description: Silver purchase cost minus COGS of sold silver items
        totalRevenueAed:
          type: number
          description: Cumulative invoiced revenue (all-time)
        soldCostAed:
          type: number
          description: All-time exact FIFO purchase cost (COGS) of sold items
        netProfitAed:
          type: number
          description: totalRevenueAed - all-time COGS
        totalPhysicalRemainingGrams:
          type: number
          description: Current live physical metal balance across every stock category
        totalPurchaseDebitAed:
          type: number
          description: All-time purchase cash outflow (cash debit)
        totalSalesCreditAed:
          type: number
          description: All-time invoiced sales revenue (cash credit)
        categoryBreakdown:
          type: array
          description: All-time metal movement and live vault balance by stock category
          items:
            $ref: "#/components/schemas/DashboardCategoryStock"

    DashboardCategoryStock:
      type: object
      required: [category, label, purchasedGrams, soldGrams, remainingGrams]
      properties:
        category:
          type: string
        label:
          type: string
        purchasedGrams:
          type: number
          description: All-time metal purchased/in for this category
        soldGrams:
          type: number
          description: All-time metal sold/out for this category
        remainingGrams:
          type: number
          description: Current live vault balance for this category

    SalesReportRow:
      type: object
      required: [invoiceId, invoiceNumber, date, customerName, category, description, weightGrams, ratePerGram, totalAed]
      properties:
        invoiceId:
          type: integer
        invoiceNumber:
          type: string
        date:
          type: string
        customerName:
          type: string
          nullable: true
        category:
          type: string
          description: Stock category bucket for the item
        description:
          type: string
        weightGrams:
          type: number
        ratePerGram:
          type: number
        totalAed:
          type: number

    SalesReport:
      type: object
      required: [summary, rows]
      properties:
        summary:
          type: object
          required: [totalGrams, totalAed, invoiceCount]
          properties:
            totalGrams:
              type: number
            totalAed:
              type: number
            invoiceCount:
              type: integer
        rows:
          type: array
          items:
            $ref: "#/components/schemas/SalesReportRow"

    DashboardStats:
      type: object
      required:
        - todayTotalSale
        - monthlySale
        - cashCollection
        - cardCollection
        - bankTransferCollection
        - totalCustomers
        - totalProducts
        - totalInvoices
        - pendingPaymentsCount
        - recentInvoices
        - goldPricePerGram
        - silverPricePerGram
        - todayGoldJewelryCount
        - todayGoldJewelryAmount
        - todayKgBarCount
        - todayKgBarAmount
        - todayTtBarCount
        - todayTtBarAmount
        - monthlyGoldJewelryCount
        - monthlyGoldJewelryAmount
        - monthlyKgBarCount
        - monthlyKgBarAmount
        - monthlyTtBarCount
        - monthlyTtBarAmount
        - todaySilverCount
        - todaySilverAmount
        - monthlySilverCount
        - monthlySilverAmount
        - todayGoldCount
        - todayGoldAmount
        - monthlyGoldCount
        - monthlyGoldAmount
      properties:
        todayTotalSale:
          type: number
        monthlySale:
          type: number
        cashCollection:
          type: number
        cardCollection:
          type: number
        bankTransferCollection:
          type: number
        totalCustomers:
          type: integer
        totalProducts:
          type: integer
        totalInvoices:
          type: integer
        pendingPaymentsCount:
          type: integer
        goldPricePerGram:
          type: number
        silverPricePerGram:
          type: number
        todayGoldJewelryCount:
          type: integer
        todayGoldJewelryAmount:
          type: number
        todayKgBarCount:
          type: integer
        todayKgBarAmount:
          type: number
        todayTtBarCount:
          type: integer
        todayTtBarAmount:
          type: number
        monthlyGoldJewelryCount:
          type: integer
        monthlyGoldJewelryAmount:
          type: number
        monthlyKgBarCount:
          type: integer
        monthlyKgBarAmount:
          type: number
        monthlyTtBarCount:
          type: integer
        monthlyTtBarAmount:
          type: number
        todaySilverCount:
